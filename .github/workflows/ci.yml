# CI — keeps the wire protocol from drifting between the TS package and the
# Rust supervisor-core. Runs the shared-fixture conformance on BOTH sides.
# (The cargo-dist release pipeline lives in release.yml; this is the PR/push
# gate that catches a protocol mismatch BEFORE release.)
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust + CLI quality gates
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - run: cargo fmt --all -- --check
      # PACKET 40 (audit / AGENTS.md invariant 6): gate the whole workspace
      # EXCEPT the Tauri crate. The old -p supervisor-core -p decent scope
      # left bins/decent-node-shim never compiled, clippy'd, or tested —
      # that gap is now closed. decent-app (Tauri) is deliberately excluded
      # here: it ships macOS-only, and compiling its GTK/WebKit stack on
      # Linux is the exact failure that broke the v0.0.8 release
      # (see dist-workspace.toml's precise-builds note). It is gated on
      # macOS in the decent-app-rust job below, on the platform it ships to.
      - run: cargo clippy --workspace --exclude decent-app --all-targets --all-features -- -D warnings
      # Includes Rust cross-language fixture conformance.
      - run: cargo test --workspace --exclude decent-app
      - run: cargo build -p decent
      - run: ./target/debug/decent --version
      - run: ./target/debug/decent --help

  protocol:
    name: protocol package conformance (TS)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
        working-directory: packages/protocol
      - run: bun run build
        working-directory: packages/protocol
      - run: bun run test
        working-directory: packages/protocol

  client:
    name: client package (TS)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
        working-directory: packages/client
      - run: bun run build
        working-directory: packages/client
      - run: bun run test
        working-directory: packages/client

  runner-core:
    name: runner-core package (TS)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
        working-directory: packages/runner-core
      - run: bun run build
        working-directory: packages/runner-core
      # The output-verification gate needs a REAL ffmpeg/ffprobe: without it
      # those suites silently skip and CI reports green having executed zero
      # of their assertions (audit-tests item 9). Install it and then FAIL
      # if it is missing, so a future workflow edit that drops this step (or
      # an apt mirror serving a broken package) cannot quietly disarm the
      # dead-GPU guard again.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # REQUIRE_FF=1 turns the suites' `describe.skipIf(!haveSystemFf)` into a
      # hard failure: the guard that catches "succeeded but produced garbage"
      # must never silently not-run. (See verify-output.test.ts /
      # verify-before-upload.test.ts gate tests.)
      - run: bun run test
        working-directory: packages/runner-core
        env:
          REQUIRE_FF: '1'

  decent-app-rust:
    name: Tauri crate (macOS — the platform it ships to)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      # generate_context! panics without the built frontend at ../dist
      # (tauri.conf.json frontendDist) — the frontend build is a PREREQ of
      # compiling the Rust crate, not merely of shipping it.
      - run: bun install --frozen-lockfile
        working-directory: apps/decent-app
      - run: bun run build
        working-directory: apps/decent-app
      # PACKET 40: the Tauri crate ships macOS-only (the app's dist target is
      # aarch64-apple-darwin), so it is gated HERE, not on ubuntu — compiling
      # its GTK/WebKit stack on Linux is the known trap that broke the v0.0.8
      # release despite `dist = false` (see dist-workspace.toml's
      # precise-builds note). AGENTS.md invariant 6 (one core, every surface
      # gated) is satisfied per-platform instead of pretending ubuntu can
      # cover a crate it never builds for release.
      - run: cargo clippy -p decent-app --all-targets --all-features -- -D warnings
      - run: cargo test -p decent-app

  app-frontend:
    name: Tauri frontend build + tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
        working-directory: apps/decent-app
      - run: bun run build
        working-directory: apps/decent-app
      - run: bun run test
        working-directory: apps/decent-app
