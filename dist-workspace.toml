[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Publish jobs to run after a successful release build. Without this key,
# cargo-dist generates the homebrew formula but never pushes it to the tap —
# v0.0.8's formula had to be committed by hand (tap 5963aa0). With it, the
# generated release.yml gains the publish-homebrew job.
publish-jobs = ["homebrew"]
tap = "decent-render/homebrew-tap"
formula = "decent"
# Target platforms to build apps for (Rust target-triple syntax).
#
# Intel Macs are excluded because the render payloads are arm64-compiled.
# Windows is out of scope.
#
# GNU rather than musl, deliberately. The usual advice is to ship both and let
# the installer pick, but the render payloads pin
# `@remotion/compositor-linux-{arm64,x64}-gnu` — a musl node would install
# cleanly and then download a glibc payload it cannot execute. musl is a second
# payload lane, not a supervisor target; adding one here without the other would
# just move the failure later.
#
# aarch64 Linux is supported but is NOT a GPU target: chrome-for-testing has no
# stable linux-arm64 build, so Remotion substitutes a Playwright chromium.
# `capabilities.rs` reports `gpu: false` there, which is correct, not a bug.
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
# Where to host releases
hosting = "github"
# Build each distable package with `-p` instead of one unified workspace
# build. Without this, the Linux builders compile the Tauri debug app's
# GTK stack (gdk-sys) despite its `dist = false` — the flag excludes it
# from ARTIFACTS, not from a unified BUILD — and the runners have no GTK
# headers, which killed the first v0.0.8 release run (32601441473).
precise-builds = true

# cargo-dist owns .github/workflows/release.yml. Pin its generated action
# references through the supported generator config rather than hand-editing.
[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1" # v7
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8

# Homebrew tap — cargo-dist generates Formula/<crate>.rb and pushes it on
# tag via the publish-homebrew-formula job in release.yml. Requires the
# HOMEBREW_TAP_TOKEN secret in the repo (GitHub PAT with repo scope on
# decent-render/homebrew-tap). NOTE: `tap` and `formula` are FLAT keys in
# [dist] — cargo-dist 0.32 does not read a [dist.homebrew] table; the old
# table is why v0.0.8's formula never got pushed (manual tap commit 5963aa0)
# and why `dist generate` warned "no tap was specified".
#
# The tap is the macOS story: `decent upgrade` is `brew upgrade` there. Linux
# operators get the generated shell installer instead. Homebrew does run on
# Linux, but effectively nobody operating a headless render box has it, and
# bootstrapping it to serve one formula is a worse ask than the installer.
#
# Now that Linux targets exist, cargo-dist emits on_macos/on_linux blocks in the
# formula. That also fixes a latent bug in the single-target formula: it carried
# `depends_on arch: :arm64` with no `depends_on :macos`, so Homebrew-on-Linux
# arm64 would have installed a Mach-O binary that cannot exec.

